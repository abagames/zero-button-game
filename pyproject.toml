[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-button-game"
version = "0.1.0"
description = "Deterministic puzzle GIF, MP4, and three-puzzle media production pipeline"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
zero-button-game = "zero_button_game.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
